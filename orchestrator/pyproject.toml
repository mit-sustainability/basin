[project]
name = "orchestrator"
version = "0.0.3"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["orchestrator*"]
exclude = ["orchestrator.tests*"]

[tool.dagster]
module_name = "orchestrator"
version = "0.0.3"
