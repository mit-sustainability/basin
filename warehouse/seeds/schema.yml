version: 2

seeds:
  - name: parking_tracked_lots
    description: "Approved parking lot IDs published by the parking staging model."
    columns:
      - name: parking_lot
        description: "Parking lot ID included in the published parking contract. 1042 available after 2021-06-23, 1046 available after 2024-12-02."
        data_tests:
          - unique
          - not_null
  - name: emission_factor_assignment
    description: >
      Which emission factor release each category uses for which fiscal years. Edited by hand and reviewed;
      nothing switches automatically when a release is archived. Empty fy_end = open-ended.
      Policy: existing years keep the release they were reported with; new fiscal years use the latest release.
    config:
      column_types:
        category: text
        family: text
        version: text
        fy_start: integer
        fy_end: integer
    columns:
      - name: category
        description: "Downstream pipeline category (purchased_goods, construction, ...)"
        data_tests: [not_null]
      - name: family
        description: "Emission factor family in stg_emission_factor_archive"
        data_tests: [not_null]
      - name: version
        description: "Release version in stg_emission_factor_archive"
        data_tests: [not_null]
      - name: fy_start
        description: "First fiscal year (inclusive)"
        data_tests: [not_null]
      - name: fy_end
        description: "Last fiscal year (inclusive); null = open-ended"
